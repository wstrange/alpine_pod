class: EventManager
table: event_managers
database: all
fields:
  id: UuidValue, defaultModel=random_v7
  event: Event?, relation(name=event_managers, onDelete=Cascade)
  member: Member?, relation(name=member_managers, onDelete=Cascade)
  assignedAt: DateTime?
  updatedAt: DateTime, default=now

indexes:
  event_manager_idx:
    fields: eventId, memberId
    unique: true
